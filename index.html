<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洛克王国 · 异色精灵代肝</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-wrapper">
        <h1 class="cute-title">洛克王国</h1>
        <p class="cute-subtitle">异色精灵图鉴</p>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn active" data-group="all" onclick="handleGroupFilter('all')">全部</button>
      <button class="nav-btn" data-group="赛季异色" onclick="handleGroupFilter('赛季异色')">赛季异色</button>
      <button class="nav-btn" data-group="赛季奇遇异色" onclick="handleGroupFilter('赛季奇遇异色')">赛季奇遇</button>
      <button class="nav-btn" data-group="活动异色" onclick="handleGroupFilter('活动异色')">活动异色</button>
      <button class="nav-btn" data-group="season-battle-pass" onclick="handleGroupFilter('season-battle-pass')">赛季战令</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="搜索精灵名称..." />
      <button class="search-btn" id="searchBtn" onclick="handleSearch()">🔍 搜索</button>
    </div>

    <div class="card-grid" id="cardGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <span>正在召唤精灵中...</span>
      </div>
    </div>

    <div class="footer">
      <p>🎮 洛克王国异色精灵图鉴 · 代肝服务</p>
    </div>
  </div>

  <button class="admin-btn" onclick="openAdminLogin()">⚙️</button>

  <div class="modal-overlay" id="adminLoginModal">
    <div class="modal">
      <button class="modal-close" onclick="closeAdminLogin()">×</button>
      <h2>🔐 管理登录</h2>
      <p>请输入管理员密码以访问内容管理</p>
      <div class="modal-error" id="adminLoginError">密码输入错误，请重新输入</div>
      <input type="password" id="adminPassword" placeholder="输入管理员密码" />
      <button onclick="verifyAdminPassword()">登 录</button>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <div class="admin-title">⚙️ 内容管理系统</div>
      <div class="admin-stats">
        <div class="admin-stat">
          <div class="admin-stat-value" id="adminTotalCount">0</div>
          <div class="admin-stat-label">总卡片数</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-value" id="adminModifiedCount">0</div>
          <div class="admin-stat-label">已修改</div>
        </div>
      </div>
      <div class="admin-actions">
        <button class="admin-action-btn save" onclick="saveAdminChanges()">💾 保存</button>
        <button class="admin-action-btn cancel" onclick="cancelAdminChanges()">🔄 重置</button>
        <button class="admin-action-btn close" onclick="closeAdminPanel()">✕ 关闭</button>
      </div>
    </div>
    <div class="admin-search">
      <input type="text" class="admin-search-input" placeholder="🔍 搜索卡片名称..." oninput="filterAdminCards(this.value)" />
    </div>
    <div class="admin-card-list" id="adminCardList"></div>
  </div>

  <div class="save-status" id="saveStatus"></div>

  <script src="auth.js"></script>
  <script src="pets.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
